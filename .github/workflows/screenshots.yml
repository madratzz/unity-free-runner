name: Scene screenshots

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repos to capture, one per line or comma-separated: owner/repo or owner/repo@branch"
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          items = []
          for raw in re.split(r"[\n,]+", os.environ["REPOS"]):
              raw = raw.strip()
              if not raw:
                  continue
              repo, _, ref = raw.partition("@")
              items.append({"repo": repo, "ref": ref, "name": re.sub(r"[^A-Za-z0-9_.-]", "_", raw)})
          print("matrix=" + json.dumps({"include": items}))
          EOF

  capture:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: student
          lfs: true

      - name: Find the Unity project and editor image
        id: unity
        run: |
          proj=$(dirname "$(dirname "$(find student -path '*/ProjectSettings/ProjectVersion.txt' -not -path '*/Library/*' | head -1)")")
          if [ -z "$proj" ] || [ "$proj" = "." ]; then echo "No Unity project found"; exit 1; fi
          ver=$(sed -n 's/^m_EditorVersion: //p' "$proj/ProjectSettings/ProjectVersion.txt" | tr -d '\r')
          image="unityci/editor:ubuntu-${ver}-base-3"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            mm=$(echo "$ver" | cut -d. -f1,2)
            alt=$(curl -s "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=ubuntu-${mm}." \
              | python3 -c 'import json,re,sys; t=[r["name"] for r in json.load(sys.stdin)["results"] if re.fullmatch(r"ubuntu-[\d.]+f\d+-base-3", r["name"])]; k=lambda n:[int(x) for x in re.findall(r"\d+", n)]; print(sorted(t,key=k)[-1] if t else "")')
            [ -n "$alt" ] || { echo "No editor image for $ver"; exit 1; }
            echo "::warning::Unity $ver has no image; using $alt (project is upgraded in this run only)"
            image="unityci/editor:$alt"
          fi
          echo "project=$proj" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Add the capture script
        run: cp -r runner/Editor/SceneShots "${{ steps.unity.outputs.project }}/Assets/SceneShots"

      - name: Capture scenes
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # Unity 6 rejects a .ulf copied from another machine ("TimeStamp validation failed"),
          # so prefer signing in with the account (UNITY_EMAIL + UNITY_PASSWORD).
          if [ -z "$UNITY_EMAIL$UNITY_LICENSE" ]; then echo "::error::Set UNITY_EMAIL + UNITY_PASSWORD (or UNITY_LICENSE)"; exit 1; fi
          mkdir -p out lic
          [ -n "$UNITY_LICENSE" ] && printf '%s' "$UNITY_LICENSE" > lic/Unity_lic.ulf
          status=0
          docker run --rm \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            -v "$PWD/${{ steps.unity.outputs.project }}:/project" -v "$PWD/out:/out" -v "$PWD/lic:/lic:ro" \
            "${{ steps.unity.outputs.image }}" bash -c '
              # Personal seats have no "com.unity.editor.headless" entitlement, which -batchmode needs,
              # so run the normal editor inside xvfb; SceneShots.Capture quits the editor itself.
              # Unity could not create its preferences folder under /root, so give it a writable HOME
              # where the licensing client can keep the sign-in between the two editor launches.
              export HOME=/tmp/home XDG_DATA_HOME=/tmp/home/.local/share XDG_CONFIG_HOME=/tmp/home/.config
              mkdir -p "$XDG_DATA_HOME/unity3d/Unity" "$XDG_CONFIG_HOME/unity3d"
              if [ -n "$UNITY_EMAIL" ]; then
                login=(-username "$UNITY_EMAIL" -password "$UNITY_PASSWORD")
                # Sign in once in batch mode (it honours -username/-password) so the token is saved.
                timeout 5m unity-editor -quit -logFile /out/signin.log "${login[@]}" || true
              else
                login=(-manualLicenseFile /lic/Unity_lic.ulf)
              fi
              # Call the binary: the image'"'"'s unity-editor wrapper always adds -batchmode.
              timeout 10m xvfb-run -a -s "-screen 0 1920x1080x24" "$UNITY_PATH/Editor/Unity" "${login[@]}" -projectPath /project -executeMethod SceneShots.Capture -outDir /out -logFile /out/unity.log
              exit $?
            ' || status=$?
          rm -rf lic
          ls -la out
          echo '::group::signin.log'; grep -i 'licens\|token\|entitle\|error' out/signin.log 2>/dev/null | tail -n 40; echo '::endgroup::'
          echo '::group::unity.log (last 120 lines)'; tail -n 120 out/unity.log 2>/dev/null; echo '::endgroup::'
          if grep -q "TimeStamp validation failed\|No valid Unity Editor license" out/unity.log 2>/dev/null; then
            echo "::error::Unity licence activation failed"; exit 1
          fi
          ls out/*.png >/dev/null 2>&1 || { echo "::error::Unity exited ($status) without any screenshots (see unity.log)"; exit 1; }
          [ "$status" = 0 ] || echo "::warning::Unity exited with $status but produced screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.name }}
          path: out
          retention-days: 7
